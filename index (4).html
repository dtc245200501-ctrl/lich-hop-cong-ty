<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch họp công ty</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 12px; }
        th { text-align: center; }
    </style>
</head>
<body>
    <h1>Lịch họp công ty</h1>
    <table>
        <tr>
            <th rowspan="2">Ngày</th>
            <th colspan="2">Giờ</th>
            <th rowspan="2">Nội dung cuộc họp</th>
        </tr>
        <tr>
            <th>Bắt đầu</th>
            <th>Kết thúc</th>
        </tr>
        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:00</td>
            <td>09:00</td>
            <td>Họp giao ban đầu tuần</td>
        </tr>
        <tr>
            <td>09:30</td>
            <td>10:30</td>
            <td>Họp phòng kinh doanh</td>
        </tr>
        <tr>
            <td>Thứ Ba</td>
            <td colspan="2">08:00 – 11:00 (3 giờ)</td>
            <td>Họp triển khai dự án mới</td>
        </tr>
        <tr>
            <td rowspan="2">Thứ Tư</td>
            <td>08:00</td>
            <td>09:00</td>
            <td>Họp phòng kỹ thuật</td>
        </tr>
        <tr>
            <td colspan="2">13:00 – 16:00 (3 giờ)</td>
            <td>Họp đánh giá tiến độ dự án</td>
        </tr>
    </table>
</body>
</html>
